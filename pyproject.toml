[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micro-dl"
version = "0.1.0"
description = "A small deep learning framework built from scratch with NumPy and CuPy backends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "typer>=0.16.0",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x[ctk]>=14.1.1"]

[project.scripts]
micro-dl = "micro_dl.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
